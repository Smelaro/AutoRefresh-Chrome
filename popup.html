<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Configuración de Auto Refresh</title>
    <style>
      body {
        width: 200px;
        padding: 10px;
        font-family: Arial, sans-serif;
      }
      #status {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h3>Auto Refresh</h3>
    <div>
      <label for="interval">Intervalo (segundos):</label>
      <input type="number" id="interval" min="1" value="15" />
    </div>
    <div>
      <button id="save">Guardar</button>
    </div>
    <div>
      <button id="start">Iniciar</button>
      <button id="stop">Detener</button>
    </div>
    <div id="status">Estado: Inactivo</div>

    <script src="popup.js"></script>
  </body>
</html>
